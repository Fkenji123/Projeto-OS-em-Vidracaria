{% extends 'base.html' %}
{% block title %}Cadastro de Novo Usuário{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 p-4">
            <h3 class="fw-bold mb-3 text-center">Criar Conta</h3>
            <p class="text-muted text-center mb-4">Cadastre-se para acessar o sistema da vidraria.</p>

            <form action="{{ url_for('cadastro') }}" method="POST">
                <div class="mb-3">
                    <label for="nome" class="form-label fw-bold">Nome Completo *</label>
                    <input type="text" class="form-control" id="nome" name="nome" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label fw-bold">E-mail *</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="seu@email.com" required>
                </div>
                <div class="mb-3">
                    <label for="senha" class="form-label fw-bold">Senha *</label>
                    <input type="password" class="form-control" id="senha" name="senha" required>
                </div>
                <div class="mb-4">
                    <label for="perfil" class="form-label fw-bold">Perfil *</label>
                    <select class="form-select" id="perfil" name="perfil" required>
                        <option value="Atendente" selected>Atendente</option>
                        <option value="Gerente">Gerente</option>
                        <option value="Executor">Executor</option>
                    </select>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-success fw-bold py-2">Cadastrar</button>
                </div>

                <div class="text-center">
                    <a href="{{ url_for('login') }}" class="text-decoration-none">Já tem uma conta? Faça login</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
