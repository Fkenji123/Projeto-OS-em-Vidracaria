{% extends 'base.html' %}
{% block title %}Login - Gestão de OS Vidraçaria{% endblock %}

{% block content %}
<div class="card login-card p-4">
    <h2 class="text-center fw-bold mb-4">Gestão de OS - Vidraçaria</h2>
    <form action="{{ url_for('login') }}" method="POST">
        <div class="mb-3">
            <label for="email" class="form-label fw-bold">E-mail</label>
            <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="exemplo@vidracaria.com.br" required>
        </div>
        <div class="mb-4">
            <label for="senha" class="form-label fw-bold">Senha</label>
            <input type="password" class="form-control form-control-lg" id="senha" name="senha" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 btn-accessible text-uppercase fw-bold">Entrar</button>
    </form>
</div>

<div class="text-center mt-3">
    
    <div>
        <a href="{{ url_for('ajuda') }}" class="btn btn-outline-info me-2">❓ Ajuda / Suporte</a>
        
    </div>
</div>
{% endblock %}
