{% extends 'base.html' %}
{% block title %}Cadastrar Nova Ordem de Serviço{% endblock %}

{% block content %}
<div class="card shadow-sm border-0 p-4 max-width-800 mx-auto">
    <h3 class="fw-bold mb-4">Cadastrar Nova Ordem de Serviço</h3>
    
    <form action="{{ url_for('nova_os') }}" method="POST">
        <!-- Dados do Cliente -->
        <h5 class="text-secondary border-bottom pb-2 mb-3">Dados do Cliente</h5>
        <div class="row mb-3">
            <div class="col-md-6">
                <label for="nome_cliente" class="form-label fw-bold">Nome Completo *</label>
                <input type="text" class="form-control" id="nome_cliente" name="nome_cliente" required>
            </div>
            <div class="col-md-6">
                <label for="telefone_cliente" class="form-label fw-bold">Telefone *</label>
                <input type="text" class="form-control" id="telefone_cliente" name="telefone_cliente" placeholder="(16) 99999-9999" required>
            </div>
        </div>
        <div class="mb-4">
            <label for="email_cliente" class="form-label">E-mail (opcional)</label>
            <input type="email" class="form-control" id="email_cliente" name="email_cliente">
        </div>

        <!-- Detalhes do Serviço -->
        <h5 class="text-secondary border-bottom pb-2 mb-3">Detalhes do Serviço</h5>
        <div class="mb-3">
            <label for="descricao" class="form-label fw-bold">Descrição do Serviço de Vidro *</label>
            <textarea class="form-control" id="descricao" name="descricao" rows="3" placeholder="Descreva o serviço, medidas, tipo de vidro, local de instalação..." required></textarea>
        </div>
        <div class="row mb-4">
            <div class="col-md-6">
                <label for="prazo_entrega" class="form-label fw-bold">Prazo de Entrega (Previsão) *</label>
                <input type="date" class="form-control" id="prazo_entrega" name="prazo_entrega" required>
            </div>
            <div class="col-md-6">
                <label for="prioridade" class="form-label fw-bold">Seleção de Prioridade *</label>
                <select class="form-select" id="prioridade" name="prioridade" required>
                    <option value="Baixa">Baixa</option>
                    <option value="Média" selected>Média</option>
                    <option value="Alta">Alta</option>
                    <option value="Urgente">Urgente</option>
                </select>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-2">
            <a href="{{ url_for('painel') }}" class="btn btn-secondary btn-accessible">Cancelar</a>
            <button type="submit" class="btn btn-success btn-accessible fw-bold">Cadastrar Ordem de Serviço</button>
        </div>
    </form>
    
</div>




{% endblock %}
